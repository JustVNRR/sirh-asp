name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('Directory.Packages.props', '**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore dependencies
        run: dotnet restore Sirh.slnx

      - name: Verify code formatting
        run: dotnet format whitespace Sirh.slnx --verify-no-changes

      - name: Build solution
        run: dotnet build Sirh.slnx --no-restore --configuration Release

      - name: Run tests
        run: dotnet test Sirh.slnx --no-build --configuration Release --verbosity normal

      - name: Audit NuGet dependencies for vulnerabilities
        run: |
          dotnet list Sirh.slnx package --vulnerable --include-transitive > vulnerable-packages.txt
          cat vulnerable-packages.txt
          if grep -E "Critical|High|Moderate|Low" vulnerable-packages.txt; then
            echo "Vulnerable NuGet packages detected!"
            exit 1
          fi
