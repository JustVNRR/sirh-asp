services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: sirh-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "Sirh_Dev_Password123!"
      MSSQL_PID: "Developer"
    ports:
      - "1433:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
    healthcheck:
      test: /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "Sirh_Dev_Password123!" -C -Q "SELECT 1" || exit 1
      interval: 10s
      timeout: 5s
      retries: 10

  mailpit:
    image: axllent/mailpit:latest
    container_name: sirh-mailpit
    ports:
      - "1025:1025"
      - "8025:8025"

  azurite:
    image: mcr.microsoft.com/azure-storage/azurite:latest
    container_name: sirh-azurite
    profiles: ["azure"]
    ports:
      - "10000:10000"
      - "10001:10001"
      - "10002:10002"
    volumes:
      - azurite_data:/data

volumes:
  sqlserver_data:
  azurite_data:
